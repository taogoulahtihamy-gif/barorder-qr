<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne - BarOrder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(197, 149, 46, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 24px;
      color: #c5952e;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.5); font-size: 14px; max-width: 300px; line-height: 1.6; }
    .retry-btn {
      margin-top: 24px;
      padding: 12px 32px;
      background: #c5952e;
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .retry-btn:hover { background: #d4a437; }
  </style>
</head>
<body>
  <div class="icon">&#x1F4E1;</div>
  <h1>Vous êtes hors ligne</h1>
  <p>Connectez-vous à Internet pour utiliser BarOrder. Les commandes seront disponibles dès que la connexion sera rétablie.</p>
  <button class="retry-btn" onclick="window.location.reload()">Réessayer</button>
</body>
</html>
